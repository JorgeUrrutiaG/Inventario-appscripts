<script>
    /**
     * Servicio de exportación a Excel (SheetJS).
     * @param {Object} [opciones]
     * @param {string} [opciones.entidad] - entidad por defecto ('Notebook' | 'Carro' | 'Modelo')
     * @param {Object} [opciones.datos] - { cabeceras, filas } a exportar (si no, la vista activa)
     * @param {string} [opciones.sufijo] - texto extra para el nombre del archivo
     */
    const ExcelService = {
        descargar(opciones = {}) {
            const entidad = opciones.entidad || AppState.estadoActual;
            const { cabeceras, filas } = opciones.datos || Sistema.filasVista(entidad);

            if (!filas || filas.length === 0) {
                showToast('warning', 'No hay datos para exportar');
                return;
            }

            if (typeof XLSX === 'undefined') {
                showToast('error', 'La librería de exportación no está disponible. Recarga la página.');
                return;
            }

            try {
                const wb = XLSX.utils.book_new();
                const ws = XLSX.utils.aoa_to_sheet([cabeceras, ...filas]);
                ws['!cols'] = cabeceras.map(() => ({ wch: 20 }));

                XLSX.utils.book_append_sheet(wb, ws, entidad);

                const fecha = new Date().toISOString().split('T')[0];
                const sufijo = opciones.sufijo
                    ? '_' + String(opciones.sufijo).trim().replace(/[^\wáéíóúñü]+/gi, '_')
                    : '';
                XLSX.writeFile(wb, `Inventario_${entidad}${sufijo}_${fecha}.xlsx`);
            } catch (error) {
                console.error('Error en el servicio de exportación Excel:', error);
                showToast('error', 'Error al generar el archivo Excel');
            }
        }
    };

    // Compatibilidad: botones con onclick="descargarExcel()"
    const descargarExcel = () => ExcelService.descargar();
</script>
