<script>
    function toastConfirmacion(icono, mensaje) {
        let Toast = Swal.mixin({
            toast: false,
            position: "center",
            showConfirmButton: true,
            timerProgressBar: false,
        });
        Toast.fire({
            icon: icono,
            title: mensaje,
        });
    }

    function toastTiempo(icono, mensaje) {
        let Toast = Swal.mixin({
            toast: true,
            position: "top-end",
            showConfirmButton: false,
            timer: 3000,
            timerProgressBar: true,
        });
        Toast.fire({
            icon: icono,
            title: mensaje,
        });
    }

</script>
