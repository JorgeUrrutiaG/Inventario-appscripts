<script>
    /**
     * Vista de Notebooks: tarjetas de métricas del panel inicial.
     */
    const NotebookDOM = {
        renderizar() {
            Sistema.aplicarLayout('Notebook');
            this.renderizarMetricas();
        },

        renderizarMetricas() {
            const contenedor = document.querySelector('.metrics-container');
            if (!contenedor) return;

            document.querySelector('.metrics-grid')?.remove();
            const m = AppState.metricas;
            contenedor.insertAdjacentHTML('afterbegin', `
                <div class="metrics-grid">
                    <div class="metric-card totales">
                        <div class="metric-lbl">Notebooks Total</div>
                        <div class="metric-val">${m.notebooks}</div>
                    </div>
                    <div class="metric-card urgente">
                        <div class="metric-lbl">Notebooks Malos</div>
                        <div class="metric-val">${m.malos}</div>
                    </div>
                    <div class="metric-card alta">
                        <div class="metric-lbl">Carros Total</div>
                        <div class="metric-val">${m.carros}</div>
                    </div>
                    <div class="metric-card media">
                        <div class="metric-lbl">Modelos Total</div>
                        <div class="metric-val">${m.modelos}</div>
                    </div>
                </div>`);
        }
    };
</script>
