<script>
    /**
     * Escapa caracteres HTML peligrosos para prevenir XSS al inyectar
     * contenido de origen externo (hojas de cálculo) con innerHTML.
     */
    function escapeHtml(valor) {
        return String(valor ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    /**
     * Convierte un valor de celda en una clase CSS segura (badge/marca).
     */
    function claseSegura(valor) {
        return String(valor ?? '').toLowerCase().trim().replace(/[^a-z0-9]+/g, '-');
    }

    /**
     * Tabla genérica: renderiza la entidad activa (Notebook, Carro o Modelo)
     * con búsqueda, paginación, edición por clic y eliminación por botón.
     */
    const TablaDOM = {
        paginaActual: 1,
        filasPorPagina: 14,
        datosFiltradosActuales: [],

        elementos: {
            cuerpoTabla: () => document.querySelector('.table-body'),
            cabeceraTabla: () => document.querySelector('.table-head'),
            buscador: () => document.getElementById('buscador'),
            paginador: () => document.getElementById('paginador')
        },

        /**
         * Inicializa los escuchadores fijos del componente tabla.
         */
        inicializar() {
            this.filasPorPagina = AppState.paginasTabla;

            // 1. Búsqueda global
            this.elementos.buscador()?.addEventListener('input', () => {
                this.paginaActual = 1;
                this.aplicarFiltrosYBuscar();
            });

            this._mostrarCargando();

            // 2. Único escuchador centralizado (delegación) para la barra de
            //    herramientas y las acciones de las filas
            document.querySelector('.table-container')?.addEventListener('click', (event) => {
                const target = event.target;

                if (target.closest('.btn-excel')) {
                    event.preventDefault();
                    ExcelService.descargar();
                    return;
                }

                if (target.closest('.btn-open-new')) {
                    event.preventDefault();
                    ModalDOM.abrir('crear', AppState.estadoActual);
                    return;
                }

                const btnDelete = target.closest('.btn-delete');
                if (btnDelete) {
                    event.stopPropagation();
                    ModalDOM.abrir('eliminar', AppState.estadoActual, btnDelete.getAttribute('data-id'));
                    return;
                }

                const btnEdit = target.closest('.btn-edit');
                if (btnEdit) {
                    event.stopPropagation();
                    const tr = btnEdit.closest('tr[data-json]');
                    if (tr) {
                        try {
                            const datos = JSON.parse(decodeURIComponent(tr.getAttribute('data-json')));
                            ModalDOM.abrir('editar', AppState.estadoActual, datos);
                        } catch (e) {
                            console.error('No se pudo leer la fila:', e);
                        }
                    }
                    return;
                }

                if (target.closest('.acciones-celda')) {
                    event.stopPropagation();
                    return;
                }

                // Clic en la fila → acción configurada por vista
                const fila = target.closest('tbody tr[data-json]');
                if (fila) {
                    try {
                        const datos = JSON.parse(decodeURIComponent(fila.getAttribute('data-json')));
                        const config = VISTAS[AppState.estadoActual];

                        if (config.filaClick === 'notebooks') {
                            const nombreCarro = datos[VISTAS.Carro.columnas.carro];
                            if (nombreCarro) CarroNotebooksModal.abrir(nombreCarro);
                        } else {
                            ModalDOM.abrir('editar', AppState.estadoActual, datos);
                        }
                    } catch (e) {
                        console.error('No se pudo leer la fila:', e);
                    }
                }
            });

            // 3. Paginador
            this.elementos.paginador()?.addEventListener('click', (event) => {
                const boton = event.target.closest('.btn-pagina');
                if (!boton) return;

                event.preventDefault();
                const nuevaPagina = parseInt(boton.getAttribute('data-pagina'), 10);
                if (!isNaN(nuevaPagina)) {
                    this.paginaActual = nuevaPagina;
                    this.renderizar(this.datosFiltradosActuales);
                }
            });
        },

        _mostrarCargando(mensaje = 'Cargando datos...') {
            const cuerpo = this.elementos.cuerpoTabla();
            if (cuerpo) {
                cuerpo.innerHTML = `<tr><td colspan="15" style="text-align:center">${escapeHtml(mensaje)}</td></tr>`;
            }
        },

        /**
         * Recarga la tabla desde cero (vuelve a la página 1).
         */
        refrescar() {
            this.paginaActual = 1;
            this.aplicarFiltrosYBuscar();
        },

        /**
         * Construye las filas de la vista activa (incluida la columna
         * calculada "Cantidad") y aplica el filtro de búsqueda.
         */
        aplicarFiltrosYBuscar() {
            const { cabeceras, filas } = Sistema.filasVista(AppState.estadoActual);
            const textoBusqueda = this.elementos.buscador()?.value.toLowerCase().trim() || '';

            let resultado = filas;
            if (textoBusqueda !== '') {
                resultado = resultado.filter(fila =>
                    fila.some(celda =>
                        celda !== null && celda !== undefined &&
                        String(celda).toLowerCase().includes(textoBusqueda)
                    )
                );
            }

            this.renderizar(resultado, cabeceras);
        },

        /**
         * Construye el HTML de la tabla con atributos de datos seguros.
         */
        renderizar(filas, cabeceras = null) {
            const entidad = AppState.estadoActual;
            const config = VISTAS[entidad];
            const thead = this.elementos.cabeceraTabla();
            const tbody = this.elementos.cuerpoTabla();
            if (!thead || !tbody) return;

            if (!cabeceras) cabeceras = Sistema.filasVista(entidad).cabeceras;
            this.datosFiltradosActuales = filas;

            thead.innerHTML = `<tr>${cabeceras.map(h => `<th>${escapeHtml(h)}</th>`).join('')}
                <th class="text-center">Acciones</th></tr>`;

            if (filas.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${cabeceras.length + 1}"
                    style="text-align:center; padding: 20px; color: #6b7280;">
                    No se encontraron registros.</td></tr>`;
                this.renderizarControlesPaginacion();
                return;
            }

            const inicio = (this.paginaActual - 1) * this.filasPorPagina;
            const filasPagina = filas.slice(inicio, inicio + this.filasPorPagina);
            const puedeEliminar = Sistema.puedeEliminar();
            const puedeEscribir = Sistema.puedeEscribir();
            // Carro muestra botón de edición; Notebook y Modelo muestran eliminación
            const mostrarEdicion = config.acciones === 'editar';

            tbody.innerHTML = filasPagina.map(fila => {
                const id = fila[config.columnas.id];
                const filaJsonSeguro = encodeURIComponent(JSON.stringify(fila));

                let acciones = '';
                if (mostrarEdicion) {
                    if (puedeEscribir) {
                        acciones = `<button class="btn-mini btn-edit" data-id="${escapeHtml(id)}" title="Editar"><i class="bi bi-pencil"></i></button>`;
                    }
                } else if (puedeEliminar) {
                    acciones = `<button class="btn-mini btn-delete" data-id="${escapeHtml(id)}" title="Eliminar"><i class="bi bi-trash"></i></button>`;
                }

                return `
                <tr data-json="${filaJsonSeguro}" class="text-center" style="cursor: pointer;">
                    ${fila.map((celda, i) => {
                        if (i === config.marcaCol && String(celda).trim() !== '') {
                            return `<td class="text-center"><span class="marca-${claseSegura(celda)}">${escapeHtml(celda)}</span></td>`;
                        }
                        if (i === config.estadoCol && String(celda).trim() !== '') {
                            return `<td class="text-center"><span class="badge estado-${claseSegura(celda)}">${escapeHtml(celda)}</span></td>`;
                        }
                        return `<td>${escapeHtml(celda)}</td>`;
                    }).join('')}
                    <td class="acciones-celda text-center">
                        <div>${acciones}</div>
                    </td>
                </tr>`;
            }).join('');

            this.renderizarControlesPaginacion();
        },

        /**
         * Dibuja los botones del paginador inferior.
         */
        renderizarControlesPaginacion() {
            const paginador = this.elementos.paginador();
            if (!paginador) return;

            paginador.innerHTML = '';
            const totalPaginas = Math.ceil(this.datosFiltradosActuales.length / this.filasPorPagina);
            if (totalPaginas <= 1) return;

            const maxBotonesVisibles = 5;
            let paginaInicio = Math.max(1, this.paginaActual - Math.floor(maxBotonesVisibles / 2));
            let paginaFin = Math.min(totalPaginas, paginaInicio + maxBotonesVisibles - 1);
            if (paginaFin - paginaInicio + 1 < maxBotonesVisibles) {
                paginaInicio = Math.max(1, paginaFin - maxBotonesVisibles + 1);
            }

            const crearBoton = (numero) => {
                const boton = document.createElement('button');
                boton.textContent = numero;
                boton.classList.add('btn-pagina');
                boton.setAttribute('data-pagina', numero);
                if (numero === this.paginaActual) boton.classList.add('activo');
                paginador.appendChild(boton);
            };

            const crearPuntos = () => {
                const span = document.createElement('span');
                span.textContent = '...';
                span.style.padding = '8px 12px';
                span.style.color = '#6b7280';
                paginador.appendChild(span);
            };

            if (paginaInicio > 1) {
                crearBoton(1);
                if (paginaInicio > 2) crearPuntos();
            }
            for (let i = paginaInicio; i <= paginaFin; i++) crearBoton(i);
            if (paginaFin < totalPaginas) {
                if (paginaFin < totalPaginas - 1) crearPuntos();
                crearBoton(totalPaginas);
            }
        }
    };
</script>
