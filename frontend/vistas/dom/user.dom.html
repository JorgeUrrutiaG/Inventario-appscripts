<script>
    /**
     * Contenedor UI encargado de renderizar los datos del usuario en el DOM.
     */
    const UserDOM = {
        elementos: {
            nombre: () => document.querySelector('.user-name'),
            correo: () => document.getElementById('user-correo')
        },

        async cargarInformacion() {
            try {
                const usuario = await UserService.obtenerDatos();
                AppState.usuario = usuario;

                this.elementos.nombre().innerText = usuario.nombre;
                this.elementos.correo().innerText = usuario.email;

                Sistema.actualizarPermisosUI();
            } catch (err) {
                console.error(`No se pudo cargar el perfil: ${err.message}`);
                showToast('error', 'No se pudo cargar tu perfil de usuario.');
            }
        }
    };
</script>
