<script>
    /**
     * Modal único (dialog nativo) para crear, editar y eliminar registros.
     */
    const ModalDOM = {
        _accion: null,
        _entidad: null,
        _fila: null,
        _id: null,
        _alCerrar: null,

        /**
         * Referencia perezosa al elemento <dialog> del layout.
         */
        instancia() {
            return document.getElementById('main-dialog');
        },

        /**
         * Abre el modal según la acción: 'crear' | 'editar' | 'eliminar'.
         * @param {string} accion
         * @param {string} entidad - 'Notebook' | 'Carro' | 'Modelo'
         * @param {*} payload - fila de datos (editar) o id (eliminar)
         */
        abrir(accion, entidad, payload = null) {
            const dialogo = this.instancia();
            if (!dialogo) return;

            this._accion = accion;
            this._entidad = entidad;
            this._fila = accion === 'editar' ? payload : null;
            this._id = accion === 'eliminar' ? payload
                : accion === 'editar' ? payload[VISTAS[entidad].columnas.id]
                    : null;

            const configuraciones = {
                crear: { titulo: `Nuevo ${entidad}`, clase: 'dialog-form' },
                editar: { titulo: `Editar ${entidad} #${this._id}`, clase: 'dialog-form' },
                eliminar: { titulo: `Eliminar ${entidad}`, clase: 'dialog-delete' }
            };
            const config = configuraciones[accion];
            if (!config) return;

            document.getElementById('dialog-title').textContent = config.titulo;
            document.getElementById('dialog-body').innerHTML =
                accion === 'eliminar'
                    ? `<p class="dialog-text">¿Estás seguro de eliminar el registro #${escapeHtml(this._id)}? Esta acción no se puede deshacer.</p>`
                    : FormDOM.obtenerTemplate(entidad, accion);

            dialogo.classList.remove('dialog-form', 'dialog-delete');
            dialogo.classList.add(config.clase);

            if (accion === 'editar') FormDOM.rellenar(entidad, this._fila);

            this._renderizarBotones();
            dialogo.showModal();
        },

        /**
         * Dibuja los botones del pie del modal y les asigna sus eventos.
         */
        _renderizarBotones() {
            const footer = document.getElementById('dialog-footer');
            const esEliminar = this._accion === 'eliminar';

            footer.innerHTML = `
                <button type="button" class="btn bg-gray" id="dialog-cancel-btn">Cancelar</button>
                <button type="button" class="btn ${esEliminar ? 'bg-red' : 'bg-green'}" id="dialog-confirm-btn">
                    ${esEliminar ? 'Eliminar' : 'Guardar'}
                </button>`;

            document.getElementById('dialog-cancel-btn')
                .addEventListener('click', () => this.cerrar());

            document.getElementById('dialog-confirm-btn')
                .addEventListener('click', () => {
                    if (esEliminar) this.eliminar();
                    else this.guardar();
                });
        },

        cerrar() {
            this.instancia()?.close();
            this._notificarCierre();
        },

        /**
         * Ejecuta (y limpia) el callback pendiente tras cerrarse el modal.
         */
        _notificarCierre() {
            const callback = this._alCerrar;
            this._alCerrar = null;
            if (typeof callback === 'function') callback();
        },

        /**
         * Valida, envía y recarga los datos de la entidad.
         */
        async guardar() {
            const formulario = document.getElementById('dialog-form');
            if (formulario && !formulario.checkValidity()) {
                formulario.reportValidity();
                return;
            }

            const boton = document.getElementById('dialog-confirm-btn');
            const datos = FormDOM.leer();
            const entidad = this._entidad;
            const servicio = VISTAS[entidad].servicio;
            const esCreacion = this._accion === 'crear';

            boton.disabled = true;
            boton.innerText = 'Guardando...';

            try {
                const mensaje = esCreacion
                    ? await servicio.guardar(datos)
                    : await servicio.editar(this._id, datos);
                this.cerrar();
                showToast('success', mensaje);
                await Sistema.recargarEntidad(entidad);
            } catch (err) {
                showToast('error', err.message || 'No se pudo guardar el registro');
            } finally {
                boton.disabled = false;
                boton.innerText = esCreacion ? 'Guardar' : 'Guardar';
            }
        },

        /**
         * Confirma la eliminación del registro.
         */
        async eliminar() {
            const boton = document.getElementById('dialog-confirm-btn');
            const entidad = this._entidad;
            const servicio = VISTAS[entidad].servicio;
            const id = this._id;

            boton.disabled = true;
            boton.innerText = 'Eliminando...';

            try {
                const mensaje = await servicio.eliminar(id);
                this.cerrar();
                showToast('success', mensaje);
                await Sistema.recargarEntidad(entidad);
            } catch (err) {
                this.cerrar();
                showToast('error', err.message || 'No se pudo eliminar el registro');
            } finally {
                boton.disabled = false;
                boton.innerText = 'Eliminar';
            }
        },

        /**
         * Escuchadores fijos del modal (botón X de cierre y tecla Escape).
         */
        inicializar() {
            document.querySelector('#main-dialog .dialog-close-btn')?.addEventListener('click', (e) => {
                e.preventDefault();
                this.cerrar();
            });

            this.instancia()?.addEventListener('cancel', () => this._notificarCierre());
        }
    };
</script>
