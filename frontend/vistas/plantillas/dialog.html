<dialog id="main-dialog" class="dialog-form">
    <div class="dialog-header">
        <h2 id="dialog-title">Formulario</h2>
        <button type="button" class="dialog-close-btn" aria-label="Cerrar">&times;</button>
    </div>
    <div class="dialog-body" id="dialog-body"></div>
    <div class="dialog-footer" id="dialog-footer"></div>
</dialog>

<!-- Lista de notebooks de un carro -->
<dialog id="carro-notebooks-dialog" class="dialog-list">
    <div class="dialog-header">
        <h2 id="carro-nb-title">Notebooks del Carro</h2>
        <button type="button" class="dialog-close-btn" aria-label="Cerrar">&times;</button>
    </div>
    <div class="dialog-body" id="carro-nb-body"></div>
    <div class="dialog-footer" id="carro-nb-footer" style="display: none;">
        <button type="button" class="btn btn-excel" id="carro-nb-excel">
            <i class="bi bi-file-earmark-excel"></i> Descargar Excel
        </button>
    </div>
</dialog>
