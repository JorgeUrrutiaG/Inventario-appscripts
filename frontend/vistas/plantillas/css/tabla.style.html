<style>
    .table-container {
        background-color: #eeeeee;
        width: 100%;
        /* Ocupa el espacio restante del main (flex); crece si las métricas envuelven a 2 filas */
        flex: 1 1 auto;
        min-height: 0;
        height: auto;
        padding: 0 10px;
        overflow: auto;
        border: 1px solid #5d5d5e;
        border-radius: 8px;
    }

    .table-container .table {
        color: #000000;
        width: 100%;
        border-collapse: collapse;
        text-align: left;
        font-size: 0.9em;
    }

    .table-container .table th,
    .table-container .table td {
        padding: 4px 8px;
        border-bottom: 1px solid #bebebe;
        vertical-align: middle;
    }

    .table-head {
        position: sticky;
        top: 0;
        background-color: var(--dark-color);
        color: rgb(228, 217, 217);
        z-index: 10;
    }

    .table-head th {
        text-align: center;
        font-weight: 500;
        text-transform: uppercase;
    }

    .table-container .table thead tr {
        text-align: left;
        transition: background-color 0.3s, color 0.3s;
    }

    .table-container .table tbody tr {
        transition: background-color 0.2s;
        font-weight: 600;
        cursor: pointer;
        font-size: 0.85em;
        /* Alto uniforme en todas las vistas (Notebook, Carro, Modelo) */
        /* height: 20px; */
    }

    .table-body td {
        white-space: nowrap;
        /* Evita que las celdas se rompan en mil líneas */
    }

    /* Animación de carga suave */
    .table-body {
        animation: fadeIn 0.3s ease-in;
        overflow-y: auto;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
        }

        to {
            opacity: 1;
        }
    }

    .table-container .table tbody tr:nth-child(even) {
        background-color: #dadada;
    }

    .table-container .table tbody tr:hover {
        background-color: #9c9faa;
        color: #e2f1e5;
    }

    /*----------- Badges de estados y marcas ----------*/
    .badge {
        padding: 4px 8px;
        border-radius: 15px;
        font-weight: bold;
        font-size: 0.65rem;
        background: #494949;
    }

    .btn-mini {
        border: none;
        padding: 3px 7px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.9rem;
        transition: transform 0.2s;
    }

    .btn-mini i{
        font-size: 0.6rem;
    }

    .btn-mini:hover {
        transform: scale(1.1);
    }

    .btn-edit {
        background: #036aa1e1;
        color: #e0f2fe;
    }

    .estado-malo {
        background: #771d25;
        color: white;
    }

    .estado-operativo {
        background-color: #105a2b;
        color: rgb(211, 226, 214);
    }

    .estado-semi-operativo {
        background-color: #b45309;
        color: #fff7ed;
    }

    .estado-baja {
        background-color: #374151;
        color: #e5e7eb;
    }

    .estado-activo {
        background-color: #105a2b;
        color: rgb(211, 226, 214);
    }

    .estado-inactivo {
        background-color: #771d25;
        color: white;
    }

    .btn-delete {
        background: #771d25;
        color: #ffdfdf;
    }

    /*-------- Paginador----------*/

    /* Estilo base para todos los botones numéricos */
    .btn-pagina {
        background-color: #ffffff;
        color: #333333;
        border: 1px solid #dcdcdc;
        padding: 8px 14px;
        font-size: 14px;
        font-weight: 500;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s ease;
        /* Suaviza el cambio de color */
    }

    /* Efecto al pasar el cursor por encima */
    .btn-pagina:hover {
        background-color: #f5f5f5;
        border-color: #a0a0a0;
    }

    /* Estilo exclusivo para el botón de la página actual */
    .btn-pagina.activo {
        background-color: #007bff;
        /* Azul moderno */
        color: #ffffff;
        border-color: #007bff;
        font-weight: 600;
        box-shadow: 0 2px 4px rgba(0, 123, 255, 0.2);
    }

    .paginador {
        margin: 10px 0;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 5px;
    }


    /* Contenedor superior alineado */
    .table-header-bar {
        width: 100%;
        padding: 5px;
