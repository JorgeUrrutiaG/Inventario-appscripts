<script>
    // ============================================================
    // ESTADO GLOBAL CENTRALIZADO
    // ============================================================
    const AppState = {
        estadoActual: 'Notebook',                     // 'Notebook' | 'Carro' | 'Modelo'
        datosListos: false,
        usuario: { email: '', nombre: '', perfil: '', autorizado: false },
        datos: { Notebook: [], Carro: [], Modelo: [] },
        cabeceras: { Notebook: [], Carro: [], Modelo: [] },
        metricas: { notebooks: 0, malos: 0, carros: 0, modelos: 0 },
        paginasTabla: 14
    };

    // ============================================================
    // CONFIGURACIÓN DE VISTAS (títulos, columnas, servicios)
    // ============================================================
    const VISTAS = {
        Notebook: {
            titulo: 'NOTEBOOKS',
            conMetricas: true,
            conCantidad: false,
            conBotonNuevo: false,
            dom: NotebookDOM,
            servicio: NotebookService,
            marcaCol: 2,
            estadoCol: 12,
            columnas: {
                id: 0, posicion: 1, marca: 2, modelo: 3, ram: 4, pantalla: 5,
                serie: 6, windows: 7, nroInterno: 8, anioCompra: 9, carro: 10,
                anioUso: 11, estado: 12, observacion: 13
            }
        },
        Carro: {
            titulo: 'CARROS',
            conMetricas: false,
            conCantidad: true,
            dom: CarroDOM,
            servicio: CarroService,
            marcaCol: -1,
            estadoCol: 3,
            filaClick: 'notebooks',
            acciones: 'editar',
            columnas: { id: 0, carro: 1, ubicacion: 2, estado: 3, carga: 4, responsable: 5 }
        },
        Modelo: {
            titulo: 'MODELOS',
            conMetricas: false,
            conCantidad: true,
            dom: ModeloDOM,
            servicio: ModeloService,
            marcaCol: 2,
            estadoCol: -1,
            columnas: {
                id: 0, dispositivo: 1, marca: 2, modelo: 3, color: 4, procesador: 5,
                touch: 6, lan: 7, pantalla: 8, ram: 9, windows: 10, anio: 11
            }
        }
    };

    // ============================================================
    // SISTEMA: orquestación de carga, vistas y permisos
    // ============================================================
    const Sistema = {

        // ---------- Permisos ----------
        puedeEscribir() {
            return AppState.usuario.perfil === 'Informático' ||
                AppState.usuario.perfil === 'Supervisor';
        },

        /** Crear registros (botón NUEVO): solo Supervisor. */
        puedeCrear() {
            return AppState.usuario.perfil === 'Supervisor';
        },

        puedeEliminar() {
            return AppState.usuario.perfil === 'Supervisor';
        },

        actualizarPermisosUI() {
            this._actualizarBotonNuevo();
            // Solo repinta si los datos iniciales ya cargaron (evita tapar el loading)
            if (AppState.datosListos && AppState.estadoActual) {
                TablaDOM.renderizar(TablaDOM.datosFiltradosActuales);
            }
        },

        /**
         * El botón NUEVO se oculta en la vista Notebooks y solo está disponible para Supervisor.
         */
        _actualizarBotonNuevo() {
            const btnNuevo = document.querySelector('.btn-open-new');
            if (!btnNuevo) return;
            const config = VISTAS[AppState.estadoActual];
            const permitido = this.puedeCrear() && config?.conBotonNuevo !== false;
            btnNuevo.classList.toggle('oculto', !permitido);
        },

        // ---------- Datos ----------
        async _cargarEntidad(entidad) {
            const data = await VISTAS[entidad].servicio.obtener();
            AppState.cabeceras[entidad] = data.cabeceras || [];
            AppState.datos[entidad] = data.filas || [];
        },

        async _cargarMetricas() {
            AppState.metricas = await AppScriptService.obtenerMetricas();
        },

        /**
         * Devuelve { cabeceras, filas } de una vista, con la columna
         * calculada "Cantidad" cuando corresponde (Carro / Modelo).
         */
        filasVista(entidad) {
            const config = VISTAS[entidad];
            const cabeceras = [...AppState.cabeceras[entidad]];
            const filas = AppState.datos[entidad].map(fila => [...fila]);

            if (config.conCantidad) {
                cabeceras.push('Cantidad');
                filas.forEach(fila => fila.push(this._cantidad(entidad, fila)));
            }
            return { cabeceras, filas };
        },

        _cantidad(entidad, fila) {
            const notebooks = AppState.datos.Notebook;
            const colNb = VISTAS.Notebook.columnas;
            if (entidad === 'Carro') {
                const nombreCarro = fila[VISTAS.Carro.columnas.carro];
                return notebooks.filter(nb => nb[colNb.carro] === nombreCarro).length;
            }
            const marca = fila[VISTAS.Modelo.columnas.marca];
            const modelo = fila[VISTAS.Modelo.columnas.modelo];
            return notebooks.filter(nb => nb[colNb.marca] === marca && nb[colNb.modelo] === modelo).length;
        },

        // ---------- Vistas ----------
        cambiarVista(entidad) {
            AppState.estadoActual = entidad;
            VISTAS[entidad].dom.renderizar();
            TablaDOM.refrescar();
        },

        aplicarLayout(entidad) {
            const config = VISTAS[entidad];

            const titulo = document.getElementById('titulo');
            if (titulo) titulo.innerText = config.titulo;

            if (!config.conMetricas) {
                document.querySelector('.metrics-grid')?.remove();
            }

            this._actualizarBotonNuevo();

            const barraBotones = document.querySelector('.btns-bar');
            if (barraBotones) barraBotones.style.display = 'flex';
        },

        /**
         * Recarga los datos de una entidad y repinta la vista si está activa.
         */
        async recargarEntidad(entidad) {
            await Promise.all([
                this._cargarEntidad(entidad),
                this._cargarMetricas()
            ]);
            if (AppState.estadoActual === entidad) {
                VISTAS[entidad].dom.renderizar();
                TablaDOM.refrescar();
            }
        },

        async recargarVistaActual() {
            showToast('info', 'Actualizando datos...');
            await this.recargarEntidad(AppState.estadoActual);
        },

        // ---------- Arranque ----------
        async iniciar() {
            try {
                await Promise.all([
                    UserDOM.cargarInformacion(),
                    this._cargarMetricas(),
                    this._cargarEntidad('Notebook'),
                    this._cargarEntidad('Carro'),
                    this._cargarEntidad('Modelo')
                ]);
                AppState.datosListos = true;
                this.cambiarVista(AppState.estadoActual);
            } catch (err) {
                console.error('Error crítico durante la inicialización:', err);
                showToast('error', 'Error al sincronizar los datos iniciales de la aplicación.');
                TablaDOM.renderizar([]);
            }
        }
    };

    // ============================================================
    // ARRANQUE DE LA APLICACIÓN
    // ============================================================
    document.addEventListener('DOMContentLoaded', () => {
        TopbarDOM.inicializar();
        NavigationDOM.inicializar();
        TablaDOM.inicializar();
        ModalDOM.inicializar();
        CarroNotebooksModal.inicializar();

        Sistema.iniciar();
    });
</script>
