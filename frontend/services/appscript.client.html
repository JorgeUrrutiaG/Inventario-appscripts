<script>
    /**
     * Adaptador central de comunicación con Apps Script (google.script.run).
     */
    const AppScriptService = {
        _run(nombreFuncion, ...args) {
            return new Promise((resolve, reject) => {
                google.script.run
                    .withSuccessHandler(resolve)
                    .withFailureHandler(reject)[nombreFuncion](...args);
            });
        },

        obtenerUsuarioLogueado() {
            return this._run('obtenerUsuarioLogueado');
        },

        obtenerMetricas() {
            return this._run('obtenerMetricas');
        },

        obtenerNotebooks() {
            return this._run('obtenerNotebooksBackend');
        },

        obtenerCarros() {
            return this._run('obtenerCarrosBackend');
        },

        obtenerModelos() {
            return this._run('obtenerModelosBackend');
        }
    };
</script>
